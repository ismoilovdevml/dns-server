# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No exceptions right now. Add an entry with a comment and an expiry when a
# transitive advisory has no upgrade path yet:
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "…", expires = "2026-12-31" }]
ignore = []

[licenses]
version = 2
# Permissive licences only; nothing copyleft ends up linked into the binary.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here should ever appear in a DNS server's dependency graph.
deny = [
    { name = "openssl", reason = "we do not link OpenSSL; rustls is the only TLS stack we would use" },
    { name = "openssl-sys", reason = "see openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
