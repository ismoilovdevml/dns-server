name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.*
      - src/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to push to GHCR and to attach the build provenance attestation.
  packages: write
  id-token: write
  attestations: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'ismoilovdev' }}/dns-server

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # QEMU lets one runner produce the arm64 image too. It is slow but avoids
      # the complexity of cross-compiling inside the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: the push is skipped when the secrets are absent,
      # so a fork does not fail this workflow.
      - name: Log in to Docker Hub
        id: dockerhub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outcome == 'success' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=dns-server
            org.opencontainers.image.description=Authoritative DNS server written in Rust on top of Hickory DNS

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build for the native platform only: an arm64 build under QEMU
          # takes long enough that it is not worth it just to gate a review.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Prove the image answers DNS before it is treated as good.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"

          cat > zone.toml <<'EOF'
          [server]
          udp = ["0.0.0.0:5300"]
          tcp = ["0.0.0.0:5300"]
          admin_listen = "0.0.0.0:9100"

          [zone]
          origin = "smoke.test"
          default_ttl = 60

          [zone.soa]
          mname = "ns1.smoke.test."
          rname = "hostmaster.smoke.test."

          [[zone.records]]
          name = "www"
          type = "A"
          values = ["203.0.113.10"]
          EOF

          docker run -d --name smoke \
            -p 5300:5300/udp -p 5300:5300/tcp -p 9100:9100 \
            -v "$PWD/zone.toml:/etc/dns-server/dns-server.toml:ro" \
            "$image" --config=/etc/dns-server/dns-server.toml

          # Wait for readiness rather than sleeping a fixed amount.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9100/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /readyz ---"
          curl -fsS http://127.0.0.1:9100/readyz
          echo "--- /version ---"
          curl -fsS http://127.0.0.1:9100/version
          echo "--- /metrics (first lines) ---"
          curl -fsS http://127.0.0.1:9100/metrics | head -5

          echo "--- dig ---"
          answer="$(dig +short @127.0.0.1 -p 5300 www.smoke.test A)"
          echo "got: $answer"
          test "$answer" = "203.0.113.10"

          echo "--- graceful shutdown ---"
          docker stop -t 15 smoke
          docker logs smoke 2>&1 | tail -20
          docker logs smoke 2>&1 | grep -q "shutdown complete"

      - name: Show logs on failure
        if: failure() && github.event_name == 'pull_request'
        run: docker logs smoke 2>&1 || true

      - name: Attest the build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
