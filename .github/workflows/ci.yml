name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Fewer retries, faster failures on a flaky network.
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The server binds sockets and handles signals, so it is worth proving it
        # works on more than the CI default.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: cargo test
        run: cargo test --all-features --locked

      # The library tests cover the same paths, but running the real binary
      # catches packaging problems the test harness cannot see.
      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          run() { cargo run --locked --quiet -- "$@"; }
          run --version
          run init --origin ci.example --output ci.toml --json
          run --config ci.toml record add www A 203.0.113.10 --json
          run --config ci.toml record list --json
          run --config ci.toml check --json
          run --config ci.toml zone export

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | tr -d '"' | awk '{print $3}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # `cargo check` rather than a full test run: the point is that the declared
      # MSRV still compiles, not that it passes on an old toolchain.
      - name: cargo check
        run: cargo check --all-features --locked

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh

      - name: shellcheck the deployment scripts
        run: |
          shellcheck --shell=sh \
            deploy/check-shutdown-invariants.sh \
            deploy/prove-unit-guard-fails.sh

  manifests:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: manifests

      # The example config is documentation; if it stops being valid, the docs
      # are wrong.
      - name: Validate the example config
        run: cargo run --locked --quiet -- --config vega.example.toml check

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Validate Kubernetes manifests
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -summary -strict deploy/kubernetes/vega.yaml

      # Schema validation says the probe fields are integers. It does not say
      # the numbers are survivable. This does: liveness must not be able to
      # restart us mid-drain, and no grace period may end before the drain does.
      # Every one of these values is wrong on its own and only right together.
      - name: Check the shutdown-drain invariants
        run: ./deploy/check-shutdown-invariants.sh

      # A gate that cannot fail is decoration. Break one value in a scratch copy
      # and prove the check catches it.
      - name: Prove the invariant check can fail
        run: |
          set -eu
          scratch="$(mktemp -d)"
          git archive HEAD | tar -x -C "$scratch"
          sed -i 's/periodSeconds: 10/periodSeconds: 5/' \
            "$scratch/deploy/kubernetes/vega.yaml"
          if ./deploy/check-shutdown-invariants.sh "$scratch"; then
            echo "::error::the invariant check passed a manifest whose liveness probe restarts the pod mid-drain"
            exit 1
          fi
          echo "the check rejects a bad manifest, as it must"

      # The unit file is a command line we ship, and until VEGA-007 nothing ran
      # it: `ExecStartPre=... --check` used a flag that does not exist, and with
      # Type=simple no one's service started. The guard lives in tests/cli.rs
      # (`systemd_unit_*`) and runs in the test job on every OS. This step is the
      # other half — it reintroduces that exact bug in a scratch copy and proves
      # the guard rejects it, so the guard cannot quietly become decoration.
      - name: Prove the systemd unit-file guard can fail
        run: ./deploy/prove-unit-guard-fails.sh

  # A single required check, so branch protection does not need updating every
  # time the matrix changes.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, msrv, shell, manifests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
