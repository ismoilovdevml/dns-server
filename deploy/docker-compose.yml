# Minimal production-shaped Compose deployment.
#
#   cp ../vega.example.toml ./vega.toml   # then edit it
#   docker compose up -d
#   dig +short @127.0.0.1 version.example.com TXT
#
# Note: something already owns port 53 on most Linux hosts (systemd-resolved).
# Either stop it, or publish on a different host port and point resolvers there.

services:
  vega:
    image: ghcr.io/ismoilovdevml/vega:latest
    # Build locally instead of pulling:
    #   docker compose build
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vega
    restart: unless-stopped

    # SIGTERM starts a drain (in builds after 0.2.0; 0.2.0 exits immediately and
    # simply never uses this budget): /readyz turns 503 while DNS answers for
    # shutdown_drain_secs (default 15s), then the listeners close. Compose's
    # 10s default would SIGKILL us at second 10, mid-drain, dropping the
    # in-flight TCP queries the drain exists to finish. 30s = drain 15s + 5s
    # stop budget + 2s watchdog + slop. Raise both together, never one.
    stop_grace_period: 30s
    stop_signal: SIGTERM

    command:
      - --config=/etc/vega/vega.toml

    ports:
      - "53:53/udp"
      - "53:53/tcp"
      # Admin endpoints stay on loopback — they are unauthenticated.
      - "127.0.0.1:9100:9100/tcp"

    volumes:
      - ./vega.toml:/etc/vega/vega.toml:ro

    environment:
      VEGA_LOG_FORMAT: json
      VEGA_LOG_LEVEL: info
      VEGA_ADMIN_LISTEN: 0.0.0.0:9100
      # Seconds to keep answering DNS after SIGTERM while /readyz reports 503.
      # Defaults to 15. If you raise it, raise stop_grace_period above it by at
      # least 7s or Docker will SIGKILL the drain it was told to wait for.
      # VEGA_SHUTDOWN_DRAIN_SECS: "15"

    # We run as an unprivileged user, so binding :53 needs this one capability
    # rather than the whole root capability set.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true
    read_only: true

    # A static authoritative server has no reason to grow unbounded; these caps
    # turn a runaway into a restart instead of a host-wide problem.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
