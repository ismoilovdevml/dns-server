# Kubernetes deployment for vega.
#
#   kubectl apply -f deploy/kubernetes/vega.yaml
#
# Edit the ConfigMap to describe your zone, then bump the `config-hash`
# annotation (or use a tool like Kustomize's configMapGenerator) so a config
# change actually rolls the pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: vega
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vega-config
  namespace: vega
data:
  vega.toml: |
    [server]
    udp = ["0.0.0.0:5300"]
    tcp = ["0.0.0.0:5300"]
    admin_listen = "0.0.0.0:9100"
    log_format = "json"
    log_level = "info"

    # Seconds to keep answering DNS after SIGTERM while /readyz reports 503,
    # so the EndpointSlice controller and kube-proxy can take this pod out of
    # rotation before it stops answering. Must be less than
    # terminationGracePeriodSeconds - 7 (drain + 5s stop budget + 2s watchdog);
    # deploy/check-shutdown-invariants.sh enforces that relationship in CI.
    # Requires a build newer than 0.2.0: earlier binaries reject the key at
    # startup, so the image tag and this ConfigMap have to move together.
    shutdown_drain_secs = 15

    [server.rate_limit]
    qps = 50
    burst = 100

    [zone]
    origin = "example.com"
    default_ttl = 300
    builtins = true

    [zone.soa]
    mname = "ns1.example.com."
    rname = "hostmaster.example.com."
    serial = 1
    minimum = 60

    [[zone.records]]
    name = "@"
    type = "A"
    values = ["203.0.113.10"]

    [[zone.records]]
    name = "www"
    type = "CNAME"
    values = ["example.com."]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vega
  namespace: vega
  labels:
    app.kubernetes.io/name: vega
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vega
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vega
      annotations:
        # Bump this whenever the ConfigMap changes so the rollout happens.
        config-hash: "replace-me"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      # Spread replicas so one node going away does not take the zone with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vega
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vega
          image: ghcr.io/ismoilovdevml/vega:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/vega/vega.toml
          ports:
            - name: dns-udp
              containerPort: 5300
              protocol: UDP
            - name: dns-tcp
              containerPort: 5300
              protocol: TCP
            - name: admin
              containerPort: 9100
              protocol: TCP
          env:
            # Listening above 1024 means we need no capabilities at all.
            - name: VEGA_LOG_FORMAT
              value: json
          # Liveness asks one question only: is this process alive and
          # scheduling tasks. A draining process is alive, so /healthz stays 200
          # for the whole drain — if it did not, a SIGTERM that does not
          # accompany a pod delete would get the container restarted mid-drain.
          # Readiness is the only traffic gate.
          #
          # INVARIANT: periodSeconds x failureThreshold (30s) MUST exceed the
          # shutdown hard deadline (drain 15s + 5s stop budget = 20s), or the
          # kubelet restarts us part way through the drain and we drop exactly
          # the queries the drain exists to protect.
          # Enforced by deploy/check-shutdown-invariants.sh in CI.
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # /readyz turns 503 the moment SIGTERM arrives, while the DNS
          # listeners stay bound and keep answering for shutdown_drain_secs.
          # 2s x 2 failures = the endpoint is withdrawn ~4-5s into a 15s drain,
          # leaving ~10s for kube-proxy and any external LB to catch up.
          # The startupProbe covers cold start, so no initial delay here.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/vega
              readOnly: true
      # = drain 15s + stop budget 5s + watchdog 2s + 8s slop.
      # The drain is in-process, so there is deliberately NO preStop hook: a
      # preStop sleep runs *before* SIGTERM, when the process is still fully
      # Serving and /readyz still answers 200, so it cannot serve the 503 that
      # actually takes us out of rotation. It also stacks — preStop 15s plus a
      # 15s drain is exactly this grace period, i.e. a guaranteed SIGKILL while
      # we are closing sockets — and it is not portable (the sleep action needs
      # k8s >= 1.30, the exec form needs a `sleep` binary the distroless image
      # does not ship, and neither exists under systemd or Docker).
      #
      # If your *external* load balancer is slower than the drain — a cloud NLB
      # health-checking every 10s with 2 failures, which externalTrafficPolicy:
      # Local makes load-bearing — raise shutdown_drain_secs in the ConfigMap
      # and raise this by the same number of seconds. Raise the drain, not a
      # preStop: only the drain holds /readyz at 503 for the whole window.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: vega-config
---
apiVersion: v1
kind: Service
metadata:
  name: vega
  namespace: vega
  labels:
    app.kubernetes.io/name: vega
spec:
  type: LoadBalancer
  # Preserve the client IP: `myip.` and the per-source rate limiter are both
  # useless if every query appears to come from a node.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: vega
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vega-admin
  namespace: vega
  labels:
    app.kubernetes.io/name: vega
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vega
  ports:
    - name: admin
      port: 9100
      targetPort: admin
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vega
  namespace: vega
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vega
---
# The admin port is unauthenticated by design: /metrics, /healthz, /readyz and
# /version answer anyone who can reach them. Without a policy that is every pod
# in the cluster, which hands any workload the zone size, the build version and
# a socket to hold open. DNS itself stays open to the world — that is the job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vega
  namespace: vega
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vega
  policyTypes:
    - Ingress
  ingress:
    # Queries: from anywhere, both transports.
    - ports:
        - port: dns-udp
          protocol: UDP
        - port: dns-tcp
          protocol: TCP
    # Admin: scrapers only. Relabel this to match your Prometheus namespace —
    # with no matching namespace the port is simply unreachable, which is the
    # right way for this to fail.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: admin
          protocol: TCP
