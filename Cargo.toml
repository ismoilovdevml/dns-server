[package]
name = "vega"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Otabek Ismoilov <ismoilovdev@gmail.com>"]
description = "Authoritative DNS server written in Rust on top of Hickory DNS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ismoilovdevml/vega"
homepage = "https://github.com/ismoilovdevml/vega"
keywords = ["dns", "server", "authoritative", "hickory", "networking"]
categories = ["network-programming", "command-line-utilities"]
exclude = ["assets/*", "deploy/*", ".github/*", "docs/*"]

[lib]
name = "vega"
path = "src/lib.rs"

[[bin]]
name = "vega"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.9.2"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
] }
clap = { version = "4.5.53", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.8"
# `HashTable` only: a hash set that lets the caller supply the hash and the
# comparison, so a zone probe never materialises a key (VEGA-032 §4.1). Nothing
# std offers does that. Already in the graph transitively through `indexmap`, and
# pinned to that same version so `cargo deny`'s duplicate check stays quiet.
# `default-features = false` keeps `foldhash` out: we hash names ourselves.
hashbrown = { version = "0.17.1", default-features = false, features = [
    "inline-more",
] }
hickory-proto = "0.26.1"
hickory-server = "0.26.1"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.17"
toml = "0.9.8"
toml_edit = "0.25.13"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "json",
] }

[dev-dependencies]
proptest = "1.11.0"
stats_alloc = "0.1.10"
tempfile = "3.24.0"
tower = { version = "0.5.2", features = ["util"] }

# Optimised for a long-running network daemon: fast code, small binary, and
# `panic = "abort"` so a poisoned task takes the process down instead of
# limping along in a half-initialised state.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `cargo build --profile profiling` when you need perf / flamegraphs.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Prose in doc comments names plenty of protocols and products (DoT, CloudWatch,
# NXDOMAIN); wrapping each in backticks hurts readability more than it helps.
doc_markdown = "allow"
